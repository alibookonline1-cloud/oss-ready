[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-ready"
version = "0.1.0"
description = "CLI tool to check if your repository is ready for open source."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Your Name", email = "you@example.com"}]
dependencies = []

[project.scripts]
oss-ready = "oss_ready.cli:main"

[tool.setuptools]
packages = ["oss_ready"]
